    <!-- CSS crítico inline para LCP -->
    <style>
      /* Estilos críticos para el Hero - evita FOUC + COLORES */
      #inicio {
        font-family: Inter, system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 8rem 1.5rem 6rem;
        position: relative;
        overflow: hidden;
      }
      
      /* Efectos de fondo coloridos */
      #inicio::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(from 0deg at 50% 50%, 
          rgba(6, 182, 212, 0.1) 0deg,
          rgba(147, 51, 234, 0.1) 120deg, 
          rgba(6, 182, 212, 0.1) 240deg,
          rgba(147, 51, 234, 0.1) 360deg);
        animation: rotate 20s linear infinite;
        z-index: -1;
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      /* Gradiente animado para H1 */
      .animate-gradient {
        background-size: 300% 300%;
        animation: gradientShift 4s ease infinite;
      }
      
      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      #inicio h1 {
        font-size: 3rem;
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 1.5rem;
      }
      @media (min-width: 768px) {
        #inicio h1 { font-size: 3.75rem; }
      }
    </style>
